service: upselling-shops-service
useDotenv: true

provider:
  name: aws
  runtime: nodejs14.x
  memorySize: 256
  endpointType: REGIONAL
  stage: ${env:STAGE, 'dev'}
  region: ${env:AWS_REGION, 'us-east-1'}
  versionFunctions: false
  logRetentionInDays: 14
  apiGateway:
    shouldStartNameWithService: true
    resourcePolicy: # https://www.serverless.com/framework/docs/deprecations/#AWS_API_GATEWAY_SPECIFIC_KEYS
      - Effect: Allow
        Principal:
          AWS: ${env:SERVICES_CONSUMER_ROLE_ARN, ssm:/upselling/${self:provider.stage}/roles/services-consumer-arn}
        Action: execute-api:Invoke
        Resource: "*"
  environment:
    LOG_QUEUE_URL: ${env:LOG_QUEUE_URL, ssm:/upselling/${self:provider.stage}/queues/log/url}
    LOG_SOURCE: 'shops-service'
    LOGS_API_URL: ${env:LOGS_API_URL, ssm:/upselling/${self:provider.stage}/logs-api/url}
    MONGODB_URI_SHOPS: ${env:MONGODB_URI_SHOPS, ssm:/upselling/${self:provider.stage}/database/mongodb-shops/uri}
    SANDBOX: ${env:SANDBOX, ssm:/upselling/${self:provider.stage}/sandbox}
    SHOPIFY_ADMIN_APP_API_KEY: ${env:SHOPIFY_ADMIN_APP_API_KEY, ssm:/upselling/${self:provider.stage}/shopify/api-key}
    SHOPIFY_ADMIN_APP_URL: ${env:SHOPIFY_ADMIN_APP_URL, ssm:/upselling/${self:provider.stage}/shopify-admin/url}
    SHOP_COLLECTION_IMPORT_QUEUE_URL: ${env:SHOP_COLLECTION_IMPORT_QUEUE_URL, ssm:/upselling/${self:provider.stage}/queues/shop-collection-import/url}
    SHOP_PRODUCT_IMPORT_QUEUE_URL: ${env:SHOP_PRODUCT_IMPORT_QUEUE_URL, ssm:/upselling/${self:provider.stage}/queues/shop-product-import/url}
    WEBHOOK_API_URL: ${env:WEBHOOK_API_URL}
    WEBHOOK_ARN: ${env:WEBHOOK_ARN, ssm:/upselling/${self:provider.stage}/webhooks/arn}

functions:
  addDraftOrderLineItem:
    handler: src/routes/addDraftOrderLineItem.handler
    events:
      - http:
          path: /shops/{shopId}/draft-orders/{draftOrderId}/line-items
          method: post
          authorizer: aws_iam
  cancelOrder:
    handler: src/routes/cancelOrder.handler
    events:
      - http:
          path: /orders/{orderId}/cancelation
          method: post
          authorizer: aws_iam
  cloneOffer:
    handler: src/routes/cloneOffer.handler
    events:
      - http:
          path: /offers/{offerId}/clone
          method: post
          authorizer: aws_iam
  clonePopupTheme:
    handler: src/routes/clonePopupTheme.handler
    events:
      - http:
          path: /popup-themes/{popupThemeId}/clone
          method: post
          authorizer: aws_iam
  createCollection:
    handler: src/routes/createCollection.handler
    events:
      - http:
          path: /collections
          method: post
          authorizer: aws_iam
  createDraftOrder:
    handler: src/routes/createDraftOrder.handler
    events:
      - http:
          path: /shops/{shopId}/draft-orders
          method: post
          authorizer: aws_iam
  createOffer:
    handler: src/routes/createOffer.handler
    events:
      - http:
          path: /offers
          method: post
          authorizer: aws_iam
  createOrder:
    handler: src/routes/createOrder.handler
    events:
      - http:
          path: /orders
          method: post
          authorizer: aws_iam
  createPopupTheme:
    handler: src/routes/createPopupTheme.handler
    events:
      - http:
          path: /popup-themes
          method: post
          authorizer: aws_iam
  createProduct:
    handler: src/routes/createProduct.handler
    events:
      - http:
          path: /products
          method: post
          authorizer: aws_iam
  deactivateShop:
    handler: src/routes/deactivateShop.handler
    events:
      - http:
          path: /shops/{shopId}/deactivation
          method: post
          authorizer: aws_iam
  deleteCollection:
    handler: src/routes/deleteCollection.handler
    events:
      - http:
          path: /collections/{collectionId}
          method: delete
          authorizer: aws_iam
  deleteOffer:
    handler: src/routes/deleteOffer.handler
    events:
      - http:
          path: /offers/{offerId}
          method: delete
          authorizer: aws_iam
  deleteProduct:
    handler: src/routes/deleteProduct.handler
    events:
      - http:
          path: /products/{productId}
          method: delete
          authorizer: aws_iam
  findOfferAcceptances:
    handler: src/routes/findOfferAcceptances.handler
    events:
      - http:
          path: /offers/{offerId}/acceptances
          method: get
          authorizer: aws_iam
  findOfferConversionRates:
    handler: src/routes/findOfferConversionRates.handler
    events:
      - http:
          path: /offers/{offerId}/conversion-rates
          method: get
          authorizer: aws_iam
  findOfferImpressions:
    handler: src/routes/findOfferImpressions.handler
    events:
      - http:
          path: /offers/{offerId}/impressions
          method: get
          authorizer: aws_iam
  findOfferConversions:
    handler: src/routes/findOfferConversions.handler
    events:
      - http:
          path: /offers/{offerId}/conversions
          method: get
          authorizer: aws_iam
  findOfferRevenueIncreases:
    handler: src/routes/findOfferRevenueIncreases.handler
    events:
      - http:
          path: /offers/{offerId}/revenue-increases
          method: get
          authorizer: aws_iam
  findPopupThemes:
    handler: src/routes/findPopupThemes.handler
    events:
      - http:
          path: /popup-themes
          method: get
          authorizer: aws_iam
  findShopAcceptances:
    handler: src/routes/findShopAcceptances.handler
    events:
      - http:
          path: /shops/{shopId}/acceptances
          method: get
          authorizer: aws_iam
  findShopConversionRates:
    handler: src/routes/findShopConversionRates.handler
    events:
      - http:
          path: /shops/{shopId}/conversion-rates
          method: get
          authorizer: aws_iam
  findShopConversions:
    handler: src/routes/findShopConversions.handler
    events:
      - http:
          path: /shops/{shopId}/conversions
          method: get
          authorizer: aws_iam
  findShopImpressions:
    handler: src/routes/findShopImpressions.handler
    events:
      - http:
          path: /shops/{shopId}/impressions
          method: get
          authorizer: aws_iam
  findShopRevenueIncreases:
    handler: src/routes/findShopRevenueIncreases.handler
    events:
      - http:
          path: /shops/{shopId}/revenue-increases
          method: get
          authorizer: aws_iam
  findOfferPopupThemes:
    handler: src/routes/findOfferPopupThemes.handler
    events:
      - http:
          path: /offers/{offerId}/popup-themes
          method: get
          authorizer: aws_iam
  findOffers:
    handler: src/routes/findOffers.handler
    events:
      - http:
          path: /offers
          method: get
          authorizer: aws_iam
  findOneCollectionByShopifyCollectionId:
    handler: src/routes/findOneCollectionByShopifyCollectionId.handler
    events:
      - http:
          path: /collections/shopify-collection-id/{shopifyCollectionId}
          method: get
          authorizer: aws_iam
  findOneOffer:
    handler: src/routes/findOneOffer.handler
    events:
      - http:
          path: /offers/{offerId}
          method: get
          authorizer: aws_iam
  findOneOrder:
    handler: src/routes/findOneOrder.handler
    events:
      - http:
          path: /orders/{orderId}
          method: get
          authorizer: aws_iam
  findOneOrderByShopifyOrderId:
    handler: src/routes/findOneOrderByShopifyOrderId.handler
    events:
      - http:
          path: /orders/shopify-order-id/{shopifyOrderId}
          method: get
          authorizer: aws_iam
  findOnePopupTheme:
    handler: src/routes/findOnePopupTheme.handler
    events:
      - http:
          path: /popup-themes/{popupThemeId}
          method: get
          authorizer: aws_iam
  findOneProductByShopifyProductId:
    handler: src/routes/findOneProductByShopifyProductId.handler
    events:
      - http:
          path: /products/shopify-product-id/{shopifyProductId}
          method: get
          authorizer: aws_iam
  findOneRandomShopOfferByDomain:
    handler: src/routes/findOneRandomShopOfferByDomain.handler
    events:
      - http:
          path: /shops/domain/{domain}/offers/random
          method: post
          authorizer: aws_iam
  findOneShop:
    handler: src/routes/findOneShop.handler
    events:
      - http:
          path: /shops/{shopId}
          method: get
          authorizer: aws_iam
  findOneShopByDomain:
    handler: src/routes/findOneShopByDomain.handler
    events:
      - http:
          path: /shops/domain/{domain}
          method: get
          authorizer: aws_iam
  findShopOffers:
    handler: src/routes/findShopOffers.handler
    events:
      - http:
          path: /shops/{shopId}/offers
          method: get
          authorizer: aws_iam
  findShopPopupThemes:
    handler: src/routes/findShopPopupThemes.handler
    events:
      - http:
          path: /shops/{shopId}/popup-themes
          method: get
          authorizer: aws_iam
  health:
    handler: src/routes/health.handler
    events:
      - http:
          path: /health
          method: get
  initializeShopByDomain:
    handler: src/routes/initializeShopByDomain.handler
    events:
      - http:
          path: /shops/domain/{domain}/initialization
          method: post
          authorizer: aws_iam
  region:
    handler: src/routes/region.handler
    events:
      - http:
          path: /region
          method: get
  trackOfferAcceptance:
    handler: src/routes/trackOfferAcceptance.handler
    events:
      - http:
          path: /offers/{offerId}/acceptances
          method: post
          authorizer: aws_iam
  trackOfferImpression:
    handler: src/routes/trackOfferImpression.handler
    events:
      - http:
          path: /offers/{offerId}/impressions
          method: post
          authorizer: aws_iam
  updateCollection:
    handler: src/routes/updateCollection.handler
    events:
      - http:
          path: /collections/{collectionId}
          method: put
          authorizer: aws_iam
  updateShopifyDraftOrderVariantQuantity:
    handler: src/routes/updateShopifyDraftOrderVariantQuantity.handler
    events:
      - http:
          path: /shops/{shopId}/draft-orders/{draftOrderId}/line-items/{shopifyVariantId}
          method: post
          authorizer: aws_iam
  updateOffer:
    handler: src/routes/updateOffer.handler
    events:
      - http:
          path: /offers/{offerId}
          method: put
          authorizer: aws_iam
  updateOrder:
    handler: src/routes/updateOrder.handler
    events:
      - http:
          path: /orders/{orderId}
          method: put
          authorizer: aws_iam
  updatePopupTheme:
    handler: src/routes/updatePopupTheme.handler
    events:
      - http:
          path: /popup-themes/{popupThemeId}
          method: put
          authorizer: aws_iam
  updateProduct:
    handler: src/routes/updateProduct.handler
    events:
      - http:
          path: /products/{productId}
          method: put
          authorizer: aws_iam
  updateShop:
    handler: src/routes/updateShop.handler
    events:
      - http:
          path: /shops/{shopId}
          method: put
          authorizer: aws_iam
  calculateStats:
    handler: src/workers/calculateStats.handler
    events:
      - schedule: cron(1 5,6 * * * *)
    timeout: 900
  fixShopWebhooks:
    memorySize: 512
    handler: src/workers/fixShopWebhooks.handler
    events:
      - schedule: rate(1 day)
    timeout: 900
  importShopCollections:
    memorySize: 512
    reservedConcurrency: 5
    handler: src/workers/importShopCollections.handler
    events:
      - sqs:
          arn: ${env:SHOP_COLLECTION_IMPORT_QUEUE_ARN, ssm:/upselling/${self:provider.stage}/shop-collection-import-queue-arn}
    timeout: 900
  importShopProducts:
    memorySize: 512
    reservedConcurrency: 5
    handler: src/workers/importShopProducts.handler
    events:
      - sqs:
          arn: ${env:SHOP_PRODUCT_IMPORT_QUEUE_ARN, ssm:/upselling/${self:provider.stage}/shop-product-import-queue-arn}
    timeout: 900
  updateShopActiveStatuses:
    memorySize: 512
    handler: src/workers/updateShopActiveStatuses.handler
    events:
      - schedule: rate(1 day)
    timeout: 900
  updateShopPlans:
    memorySize: 512
    handler: src/workers/updateShopPlans.handler
    events:
      - schedule: rate(1 day)
    timeout: 900

plugins:
  - serverless-offline
  - serverless-plugin-monorepo

custom:
  serverless-offline:
    httpPort: ${env:SHOPS_API_PORT, 4004}
    lambdaPort: 5002
  customDomain:
    domainName: ${env:SHOPS_SERVICE_API_DOMAIN, ssm:/upselling/${self:provider.stage}/shops-api/domain}
    basePath: ''
    certificateName: ${env:CERTIFICATE_NAME, ssm:/upselling/${self:provider.stage}/certificate-name}
    createRoute53Record: true
    endpointType: regional
    securityPolicy: tls_1_2
    autoDomain: true
