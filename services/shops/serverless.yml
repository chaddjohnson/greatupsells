service: upselling-shops-service

provider:
  name: aws
  runtime: nodejs12.x
  memorySize: 256
  timeout: 900
  endpointType: REGIONAL
  stage: ${env:STAGE, 'dev'}
  region: ${env:AWS_REGION, 'us-east-1'}
  versionFunctions: false
  logRetentionInDays: 14
  apiGateway:
    shouldStartNameWithService: true
  environment:
    WEBHOOKS_ARN: ${env:WEBHOOKS_ARN, ssm:/upselling/${self:provider.stage}/webhooks/arn}
    # SHOPIFY_ADMIN_API_KEY: ${env:SHOPIFY_ADMIN_API_KEY, ssm:/upselling/${self:provider.stage}/shopify-admin/api-key}
    # SHOPIFY_ADMIN_URL: ${env:SHOPIFY_ADMIN_URL, ssm:/upselling/${self:provider.stage}/shopify-admin/url}
    # API_URL: ${env:API_URL, ssm:/upselling/${self:provider.stage}/api/url}
    # CONTACT_EMAIL: ${env:CONTACT_EMAIL, ssm:/upselling/${self:provider.stage}/contact-email}
    # SANDBOX: ${env:SANDBOX, ssm:/upselling/${self:provider.stage}/sandbox}
    # MONGODB_URI: ${env:MONGODB_URI, ssm:/upselling/${self:provider.stage}/database/mongodb/uri~true}
    LOG_QUEUE_URL: ${env:LOG_QUEUE_URL, ssm:/upselling/${self:provider.stage}/queues/log/url}

functions:
  cancelOrder:
    handler: src/routes/cancelOrder.handler
    events:
      - http:
          path: /order/{orderId}/cancelation
          method: post
  createCollection:
    handler: src/routes/createCollection.handler
    events:
      - http:
          path: /collections
          method: post
  createOffer:
    handler: src/routes/createOffer.handler
    events:
      - http:
          path: /offers
          method: post
  createOrder:
    handler: src/routes/createOrder.handler
    events:
      - http:
          path: /orders
          method: post
  createProduct:
    handler: src/routes/createProduct.handler
    events:
      - http:
          path: /products
          method: post
  deactivateShop:
    handler: src/routes/deactivateShop.handler
    events:
      - http:
          path: /shops/{shopId}/deactivation
          method: post
  deleteCollection:
    handler: src/routes/deleteCollection.handler
    events:
      - http:
          path: /collections/{collectionId}
          method: delete
  deleteOffer:
    handler: src/routes/deleteOffer.handler
    events:
      - http:
          path: /offers
          method: delete
  deleteProduct:
    handler: src/routes/deleteProduct.handler
    events:
      - http:
          path: /products/{productId}
          method: delete
  findOfferAcceptances:
    handler: src/routes/findOfferAcceptances.handler
    events:
      - http:
          path: /offers/{offerId}/acceptances
          method: get
  findOfferConversionRates:
    handler: src/routes/findOfferConversionRates.handler
    events:
      - http:
          path: /offers/{offerId}/conversion-rates
          method: get
  findOfferConversions:
    handler: src/routes/findOfferConversions.handler
    events:
      - http:
          path: /offers/{offerId}/conversions
          method: get
  findOfferRevenueIncreases:
    handler: src/routes/findOfferRevenueIncreases.handler
    events:
      - http:
          path: /offers/{offerId}/revenue-increases
          method: get
  findOffers:
    handler: src/routes/findOffers.handler
    events:
      - http:
          path: /offers
          method: get
  findOfferViews:
    handler: src/routes/findOfferViews.handler
    events:
      - http:
          path: /offers/{offerId}/views
          method: get
  findOneCollectionByShopifyCollectionId:
    handler: src/routes/findOneCollectionByShopifyCollectionId.handler
    events:
      - http:
          path: /collections/shopify-collection-id/{shopifyCollectionId}
          method: get
  findOneOffer:
    handler: src/routes/findOneOffer.handler
    events:
      - http:
          path: /offers/{offerId}
          method: get
  findOneOrder:
    handler: src/routes/findOneOrder.handler
    events:
      - http:
          path: /orders/{orderId}
          method: get
  findOneOrderByShopifyOrderId:
    handler: src/routes/findOneOrderByShopifyOrderId.handler
    events:
      - http:
          path: /orders/shopify-order-id/{shopifyOrderId}
          method: get
  findOneProductByShopifyProductId:
    handler: src/routes/findOneProductByShopifyProductId.handler
    events:
      - http:
          path: /orders/shopify-product-id/{shopifyProductId}
          method: get
  findOneRandomOfferProduct:
    handler: src/routes/findOneRandomOfferProduct.handler
    events:
      - http:
          path: /offers/{offerId}/products/random
          method: get
  findOneRandomShopOffer:
    handler: src/routes/findOneRandomShopOffer.handler
    events:
      - http:
          path: /shops/{shopId}/offers/random
          method: get
  findOneShop:
    handler: src/routes/findOneShop.handler
    events:
      - http:
          path: /shops/{shopId}
          method: get
  findOneShopByDomain:
    handler: src/routes/findOneShopByDomain.handler
    events:
      - http:
          path: /shops/domain/{domain}
          method: get
  findShopOffers:
    handler: src/routes/findShopOffers.handler
    events:
      - http:
          path: /shops/{shopId}/offers
          method: get
  health:
    handler: src/routes/health.handler
    events:
      - http:
          path: /health
          method: get
  initializeShopByDomain:
    handler: src/routes/initializeShopByDomain.handler
    events:
      - http:
          path: /shops/domain/{domain}/initialization
          method: post
  region:
    handler: src/routes/region.handler
    events:
      - http:
          path: /region
          method: get
  trackOfferAcceptance:
    handler: src/routes/trackOfferAcceptance.handler
    events:
      - http:
          path: /offers/{offerId}/acceptances
          method: post
  trackOfferView:
    handler: src/routes/trackOfferView.handler
    events:
      - http:
          path: /offers/{offerId}/views
          method: post
  updateCollection:
    handler: src/routes/updateCollection.handler
    events:
      - http:
          path: /collections/{collectionId}
          method: put
  updateOffer:
    handler: src/routes/updateOffer.handler
    events:
      - http:
          path: /offers/{offerId}
          method: put
  updateProduct:
    handler: src/routes/updateProduct.handler
    events:
      - http:
          path: /products/{productId}
          method: put
  updateShop:
    handler: src/routes/updateShop.handler
    events:
      - http:
          path: /shops/{shopId}
          method: put

  activateAndDeactivateShops:
    handler: src/workers/activateAndDeactivateShops.handler
    events:
      - schedule: rate(1 day)
  calculateStats:
    handler: src/workers/calculateStats.handler
    events:
      - schedule: cron(1 5,6 * * *)
  fixShopWebhooks:
    handler: src/workers/fixShopWebhooks.handler
    events:
      - schedule: rate(1 day)
  removeCopiedProducts:
    handler: src/workers/removeCopiedProducts.handler
    events:
      - schedule: rate(1 day)
  shopCollectionImport:
    reservedConcurrency: 10
    handler: src/workers/shopCollectionImport.handler
    events:
      - sqs:
          arn: ${ssm:/upselling/${self:provider.stage}/shop-collection-import-queue-arn}
  shopProductImport:
    reservedConcurrency: 10
    handler: src/workers/shopProductImport.handler
    events:
      - sqs:
          arn: ${ssm:/upselling/${self:provider.stage}/shop-product-import-queue-arn}
  updateShopPlans:
    handler: src/workers/updateShopPlans.handler
    events:
      - schedule: rate(1 day)

plugins:
  - serverless-offline
  - serverless-dotenv-plugin
  - serverless-offline-sqs-external
  - serverless-plugin-monorepo

custom:
  dotenv:
    path: .env
  serverless-offline:
    httpPort: ${env:SHOPS_API_PORT}
  customDomain:
    domainName: ${ssm:/upselling/${self:provider.stage}/shops-service-api/endpoint/${self:provider.region}}
    basePath: ''
    certificateName: ${ssm:/upselling/${self:provider.stage}/certificate-name}
    createRoute53Record: true
    endpointType: regional
    securityPolicy: tls_1_2

package:
  exclude:
    - test/**
    - node_modules/aws-sdk
    - node_modules/**/aws-sdk
    - node_modules/**/*.map
