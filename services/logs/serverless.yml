service: upselling-logs-service
useDotenv: true

provider:
  name: aws
  runtime: nodejs14.x
  memorySize: 2048
  timeout: 10
  endpointType: REGIONAL
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  versionFunctions: false
  logRetentionInDays: 14
  apiGateway:
    shouldStartNameWithService: true
  environment:
    NODE_ENV: ${env:NODE_ENV, 'production'}
    ELASTICSEARCH_URL: ${env:ELASTICSEARCH_URL, ssm:/upselling/${self:provider.stage}/database/elasticsearch-logs/uri}
    MONGODB_URI_LOGS: ${env:MONGODB_URI_LOGS, ssm:/upselling/${self:provider.stage}/database/mongodb-logs/uri}

custom:
  serverless-offline:
    httpPort: ${env:LOGS_API_PORT, 4009}
    lambdaPort: 5005
  customDomain:
    domainName: ${env:LOGS_API_URL, ssm:/upselling/${self:provider.stage}/logs-api/regional-domain}
    basePath: ''
    certificateName: ${env:CERTIFICATE_NAME, ssm:/upselling/${self:provider.stage}/certificate-name}
    createRoute53Record: true
    endpointType: regional
    securityPolicy: tls_1_2
    autoDomain: true
  warmup:
    default:
      enabled: true
      concurrency: 5
      prewarm: true
      events:
        - schedule: rate(5 minutes)

functions:
  createLog:
    memorySize: 128
    reservedConcurrency: 1
    handler: src/routes/createLog.handler
    events:
      - http:
          path: /logs
          method: post
          authorizer: aws_iam
  health:
    handler: src/routes/health.handler
    events:
      - http:
          path: /health
          method: get
          cors: true
  log:
    memorySize: 128
    reservedConcurrency: 1
    handler: src/workers/log.handler
    events:
      - sqs:
          arn: ${ssm:/upselling/${self:provider.stage}/queues/log/arn, 'arn:aws:sqs:${self:provider.region}:000000000000:log-queue-dev'}
          batchSize: 10
          maximumBatchingWindow: 60
  findLogs:
    memorySize: 128
    reservedConcurrency: 1
    handler: src/routes/findLogs.handler
    events:
      - http:
          path: /logs
          method: get
          authorizer: aws_iam

plugins:
  - serverless-offline
  - serverless-plugin-monorepo
  - serverless-domain-manager
  - serverless-plugin-warmup

package:
  exclude:
    - infrastructure/**
