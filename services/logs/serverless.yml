service: greatupsells-logs-service
frameworkVersion: '^3.38'
useDotenv: true
configValidationMode: error
provider:
  name: aws
  architecture: arm64
  runtime: nodejs20.x
  timeout: 10
  endpointType: REGIONAL
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  versionFunctions: false
  logRetentionInDays: 14
  httpApi:
    shouldStartNameWithService: true
    cors: true
    # authorizers:
    #   authorizer:
    #     type: request
    #     functionName: authorizer
    #     identitySource: $request.header.authorization
    #     resultTtlInSeconds: 0
  environment:
    NODE_ENV: ${env:NODE_ENV, 'production'}
    ELASTICSEARCH_URL: ${env:ELASTICSEARCH_URL, ssm:/greatupsells/${self:provider.stage}/database/elasticsearch-logs/url, ''}
    MONGODB_URL_LOGS: ${env:MONGODB_URL_LOGS, ssm:/greatupsells/${self:provider.stage}/database/mongodb-logs/url}
    DOMAIN: ${env:DOMAIN, ssm:/greatupsells/${self:provider.stage}/domain}
    LOGS_NOTIFICATION_EMAIL: ${env:LOGS_NOTIFICATION_EMAIL, ssm:/greatupsells/${self:provider.stage}/logs-notification-email}
    EMAIL_QUEUE_URL: ${ssm:/greatupsells/${self:provider.stage}/queues/email-sending/url, ''}

custom:
  serverless-offline:
    httpPort: ${env:LOGS_API_PORT, 4009}
    lambdaPort: 4109
    prefix: 'logs-api'
  customDomain:
    domainName: ${ssm:/greatupsells/${self:provider.stage}/logs-api/regional-domain, ''}
    basePath: ''
    certificateName: ${ssm:/greatupsells/${self:provider.stage}/certificate-name, ''}
    createRoute53Record: true
    endpointType: regional
    apiType: http
    route53Params:
      healthCheckId: ${ssm:/greatupsells/${self:provider.stage}/logs-api/health-check-id, ''}
    securityPolicy: tls_1_2
    autoDomain: true
  warmup:
    default:
      enabled: true
      concurrency: 3
      prewarm: true
      events:
        - schedule: rate(5 minutes)

functions:
  createLog:
    handler: src/routes/createLog.handler
    events:
      - httpApi:
          path: /logs
          method: post
  health:
    handler: src/routes/health.handler
    events:
      - httpApi:
          path: /health
          method: get
  log:
    memorySize: 256
    reservedConcurrency: 3
    handler: src/workers/log.handler
    events:
      - sqs:
          arn: ${ssm:/greatupsells/${self:provider.stage}/queues/log/arn, 'arn:aws:sqs:${self:provider.region}:000000000000:log-queue-dev'}
          batchSize: 1
  findLogs:
    handler: src/routes/findLogs.handler
    events:
      - httpApi:
          path: /logs
          method: get

plugins:
  - serverless-offline
  - serverless-plugin-monorepo
  - serverless-domain-manager
  - serverless-plugin-warmup

package:
  patterns:
    - '!infrastructure/**'
    - '!node_modules/**/*.map'
    - '!node_modules/**/aws-sdk'
    - '!node_modules/aws-sdk'
    - '!node_modules/eslint'
