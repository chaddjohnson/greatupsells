service: greatupsells-email-service
variablesResolutionMode: 20210326
useDotenv: true

provider:
  name: aws
  runtime: nodejs14.x
  memorySize: 2048
  timeout: 10
  endpointType: REGIONAL
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  versionFunctions: false
  logRetentionInDays: 14
  apiGateway:
    shouldStartNameWithService: true
  environment:
    NODE_ENV: ${env:NODE_ENV, 'production'}

custom:
  serverless-offline:
    httpPort: 4010
    lambdaPort: 4110
  customDomain:
    domainName: ${ssm:/greatupsells/${self:provider.stage}/email-api/regional-domain, ''}
    basePath: ''
    certificateName: ${ssm:/greatupsells/${self:provider.stage}/certificate-name, ''}
    createRoute53Record: true
    endpointType: regional
    securityPolicy: tls_1_2
    autoDomain: true
  warmup:
    default:
      enabled: true
      concurrency: 5
      prewarm: true
      events:
        - schedule: rate(5 minutes)

functions:
  health:
    memorySize: 128
    handler: src/routes/health.handler
    events:
      - http:
          path: /health
          method: get
          cors: true
    warmup:
      default:
        enabled: false
  email:
    memorySize: 256
    reservedConcurrency: 3
    handler: src/workers/email.handler
    events:
      - sqs:
          arn: ${ssm:/greatupsells/${self:provider.stage}/queues/email/arn, 'arn:aws:sqs:${self:provider.region}:000000000000:email-queue-dev'}
          batchSize: 1
    warmup:
      default:
        enabled: false

plugins:
  - serverless-offline
  - serverless-plugin-monorepo
  - serverless-domain-manager
  - serverless-plugin-warmup

package:
  patterns:
    - '!infrastructure/**'
