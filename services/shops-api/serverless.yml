service: greatupsells-shops-api
useDotenv: true

provider:
  name: aws
  runtime: nodejs16.x
  memorySize: 2048
  timeout: 10
  endpointType: REGIONAL
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  versionFunctions: false
  logRetentionInDays: 14
  httpApi:
    shouldStartNameWithService: true
  environment:
    NODE_ENV: ${env:NODE_ENV, 'production'}
    APP_NAME: ${env:APP_NAME, ssm:/greatupsells/${self:provider.stage}/app-name}
    APP_NAME_SLUG: ${env:APP_NAME_SLUG, ssm:/greatupsells/${self:provider.stage}/app-name-slug}
    DOMAIN: ${env:DOMAIN, ssm:/greatupsells/${self:provider.stage}/domain}
    EMAIL_QUEUE_URL: ${ssm:/greatupsells/${self:provider.stage}/queues/email-sending/url, ''}
    LOG_QUEUE_URL: ${ssm:/greatupsells/${self:provider.stage}/queues/log/url, ''}
    LOG_SOURCE: 'shops-api'
    LOGS_API_URL: ${env:LOGS_API_URL, ssm:/greatupsells/${self:provider.stage}/logs-api/url}
    MONGODB_URL_SHOPS: ${env:MONGODB_URL_SHOPS, ssm:/greatupsells/${self:provider.stage}/database/mongodb-shops/url}
    SANDBOX: ${env:SANDBOX, ssm:/greatupsells/${self:provider.stage}/sandbox}
    SHOPIFY_ADMIN_APP_API_KEY: ${env:SHOPIFY_ADMIN_APP_API_KEY, ssm:/greatupsells/${self:provider.stage}/shopify/api-key}
    SHOPIFY_EMBED_BLOCK_ID: ${env:SHOPIFY_EMBED_BLOCK_ID, ssm:/greatupsells/${self:provider.stage}/shopify/app-embed-block/id}
    SHOP_ORDER_IMPORT_QUEUE_URL: ${ssm:/greatupsells/${self:provider.stage}/queues/shop-order-import/url, ''}
    SHOP_COLLECTION_IMPORT_QUEUE_URL: ${ssm:/greatupsells/${self:provider.stage}/queues/shop-collection-import/url, ''}
    SHOP_PRODUCT_IMPORT_QUEUE_URL: ${ssm:/greatupsells/${self:provider.stage}/queues/shop-product-import/url, ''}
    WEBHOOK_API_URL: ${env:WEBHOOK_API_URL, ''}
    WEBHOOK_ARN: ${ssm:/greatupsells/${self:provider.stage}/webhooks/arn, ''}

custom:
  serverless-offline:
    httpPort: ${env:SHOPS_API_PORT, 4004}
    lambdaPort: 4104
    noAuth: true
  customDomain:
    domainName: ${ssm:/greatupsells/${self:provider.stage}/shops-api/regional-domain, ''}
    basePath: ''
    certificateName: ${ssm:/greatupsells/${self:provider.stage}/certificate-name, ''}
    createRoute53Record: true
    endpointType: regional
    apiType: http
    route53Params:
      healthCheckId: ${ssm:/greatupsells/${self:provider.stage}/shops-api/health-check-id, ''}
    securityPolicy: tls_1_2
    autoDomain: true
  warmup:
    default:
      enabled: true
      memorySize: 128
      concurrency: 5
      prewarm: true
      events:
        - schedule: rate(5 minutes)

functions:
  activateShopPlan:
    role: ${env:SERVICES_CONSUMER_ROLE_ARN, ssm:/greatupsells/${self:provider.stage}/roles/services-consumer-arn}
    handler: src/routes/activateShopPlan.handler
    events:
      - httpApi:
          path: /shops/{shopId}/plan/activation
          method: post
          authorizer:
            type: aws_iam
  addDraftOrderLineItems:
    role: ${env:SERVICES_CONSUMER_ROLE_ARN, ssm:/greatupsells/${self:provider.stage}/roles/services-consumer-arn}
    handler: src/routes/addDraftOrderLineItems.handler
