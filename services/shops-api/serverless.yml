    handler: src/routes/updateShop.handler
    events:
      - httpApi:
          path: /shops/{shopId}
          method: put
          authorizer:
            type: aws_iam
  calculateShopMonthUpsellRevenue:
    memorySize: 512
    role: ${env:SERVICES_CONSUMER_ROLE_ARN, ssm:/greatupsells/${self:provider.stage}/roles/services-consumer-arn}
    handler: src/workers/calculateShopMonthUpsellRevenue.handler
    events:
      - schedule: cron(1 0,12 * * ? *)
    timeout: 900
    enabled: '"${self:provider.region}" == "us-east-1"'
    warmup:
      default:
        enabled: false
  calculateStats:
    memorySize: 512
    role: ${env:SERVICES_CONSUMER_ROLE_ARN, ssm:/greatupsells/${self:provider.stage}/roles/services-consumer-arn}
    handler: src/workers/calculateStats.handler
    events:
      - schedule: cron(1 5,6 * * ? *)
    timeout: 900
    enabled: '"${self:provider.region}" == "us-east-1"'
    warmup:
      default:
        enabled: false
  fixShopWebhooks:
    memorySize: 512
    role: ${env:SERVICES_CONSUMER_ROLE_ARN, ssm:/greatupsells/${self:provider.stage}/roles/services-consumer-arn}
    handler: src/workers/fixShopWebhooks.handler
    events:
      - schedule: rate(1 day)
    timeout: 900
    enabled: '"${self:provider.region}" == "us-east-1"'
    warmup:
      default:
        enabled: false
  importShopOrders:
    memorySize: 512
    reservedConcurrency: 2
    role: ${env:SERVICES_CONSUMER_ROLE_ARN, ssm:/greatupsells/${self:provider.stage}/roles/services-consumer-arn}
    handler: src/workers/importShopOrders.handler
    events:
      - sqs:
          arn: ${ssm:/greatupsells/${self:provider.stage}/queues/shop-order-import/arn, 'arn:aws:sqs:${self:provider.region}:000000000000:shop-order-import-queue-dev'}
    timeout: 900
    warmup:
      default:
        enabled: false
  importShopCollections:
    memorySize: 512
    reservedConcurrency: 2
    role: ${env:SERVICES_CONSUMER_ROLE_ARN, ssm:/greatupsells/${self:provider.stage}/roles/services-consumer-arn}
    handler: src/workers/importShopCollections.handler
    events:
      - sqs:
          arn: ${ssm:/greatupsells/${self:provider.stage}/queues/shop-collection-import/arn, 'arn:aws:sqs:${self:provider.region}:000000000000:shop-collection-import-queue-dev'}
    timeout: 900
    warmup:
      default:
        enabled: false
  importShopProducts:
    memorySize: 512
    reservedConcurrency: 2
    role: ${env:SERVICES_CONSUMER_ROLE_ARN, ssm:/greatupsells/${self:provider.stage}/roles/services-consumer-arn}
    handler: src/workers/importShopProducts.handler
    events:
      - sqs:
