name: greatupsells-logs-service
on:
  push:
    branches:
      - test
      - production
    paths:
      - .github/workflows/logs-service.yml
      - services/logs/**
      - packages/email-client/**
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Set Environment Variables
        run: |
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
      - name: Verify AWS Credentials
        run: aws sts get-caller-identity
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: yarn
      - uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Install Global Packages
        run: npm install -g serverless
      - name: Run Terraform (test)
        if: success() && github.ref == 'refs/heads/test'
        run: yarn infrastructure
        working-directory: services/logs
        env:
          STAGE: ${{ env.BRANCH }}
          MONGODB_APP_PASSWORD: ${{ secrets.MONGODB_APP_PASSWORD_TEST }}
          ELASTICSEARCH_APP_PASSWORD: ${{ secrets.ELASTICSEARCH_APP_PASSWORD_TEST }}
      - name: Run Terraform (production)
        if: success() && github.ref == 'refs/heads/master'
        run: yarn infrastructure
        working-directory: services/logs
        env:
          STAGE: ${{ env.BRANCH }}
          MONGODB_APP_PASSWORD: ${{ secrets.MONGODB_APP_PASSWORD }}
          ELASTICSEARCH_APP_PASSWORD: ${{ secrets.ELASTICSEARCH_APP_PASSWORD }}
      - name: Inject "MONGODB_URL_LOGS" SSM Parameter
        uses: 'marvinpinto/action-inject-ssm-secrets@latest'
        with:
          ssm_parameter: '/greatupsells/${{ env.BRANCH }}/database/mongodb-logs/url'
          env_variable_name: 'MONGODB_URL_LOGS'
      - name: Inject "ELASTICSEARCH_URL" SSM Parameter
        uses: 'marvinpinto/action-inject-ssm-secrets@latest'
        with:
          ssm_parameter: '/greatupsells/${{ env.BRANCH }}/database/elasticsearch-logs/url'
          env_variable_name: 'ELASTICSEARCH_URL'
      - name: Install Node Modules
        run: yarn install --immutable
      - name: Build Packages
        run: yarn workspaces focus --all && NODE_ENV=production lerna run build --stream --scope=@greatupsells/*
      - name: Run Data Migrations
        run: yarn migrate
        working-directory: services/logs
        env:
          MONGODB_URL_LOGS: ${{ env.MONGODB_URL_LOGS }}
          ELASTICSEARCH_URL: ${{ env.ELASTICSEARCH_URL }}
      - name: Download .serverless directory
        run: aws s3 sync s3://greatupsells-infrastructure2/serverless/logs-service . --region us-east-1
        working-directory: services/logs
      - name: Deploy Serverless Application to us-east-1
        run: serverless deploy --stage $BRANCH --region us-east-1
        working-directory: services/logs
      # - name: Deploy Serverless Application to eu-west-1
      #   run: serverless deploy --stage $BRANCH --region eu-west-1
      #   working-directory: services/logs
      #   if: ${{ github.ref == 'refs/heads/production' }}
      # - name: Deploy Serverless Application to ap-northeast-1
      #   run: serverless deploy --stage $BRANCH --region ap-northeast-1
      #   working-directory: services/logs
      #   if: ${{ github.ref == 'refs/heads/production' }}
      - name: Sync .serverless directory
        run: aws s3 sync .serverless s3://greatupsells-infrastructure2/serverless/logs-service/.serverless --region us-east-1
        working-directory: services/logs
      - name: Uninstall Global Packages
        if: always()
        run: npm uninstall -g serverless
