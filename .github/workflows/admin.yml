name: greatupsells-admin
on:
  push:
    branches:
      - test
      - production
    paths:
      - .github/workflows/admin.yml
      - applications/admin/**
      - packages/react-components
      - packages/react-hooks
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Set Environment Variables
        run: echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: Inject "ASSETS_DOMAIN" SSM Parameter
        uses: 'marvinpinto/action-inject-ssm-secrets@latest'
        with:
          ssm_parameter: '/greatupsells/${{ env.BRANCH }}/assets/domain'
          env_variable_name: 'ASSETS_DOMAIN'
      - name: Inject "ASSETS_URL" SSM Parameter
        uses: 'marvinpinto/action-inject-ssm-secrets@latest'
        with:
          ssm_parameter: '/greatupsells/${{ env.BRANCH }}/assets/url'
          env_variable_name: 'ASSETS_URL'
      - name: Inject "ADMIN_API_URL" SSM Parameter
        uses: 'marvinpinto/action-inject-ssm-secrets@latest'
        with:
          ssm_parameter: '/greatupsells/${{ env.BRANCH }}/admin-api/url'
          env_variable_name: 'ADMIN_API_URL'
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 14.17.0
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v1
      - name: Install Global Packages
        run: npm install -g yarn serverless
      - name: Run Terraform
        run: ./run.sh
        working-directory: applications/admin/infrastructure
        env:
          STAGE: ${{ env.BRANCH }}
      - name: Install Node Modules
        run: yarn install
      - name: Build Packages
        run: lerna bootstrap --force-local && NODE_ENV=production lerna run build --stream --scope=@greatupsells/*
      - name: Download .serverless directory
        run: aws s3 sync s3://greatupsells-infrastructure/serverless/admin . --region us-east-1
        working-directory: applications/admin
      - name: Build Next.js Application
        run: NODE_ENV=production yarn build
        working-directory: applications/admin
      - name: Upload Next.js Static Assets to Assets Bucket
        run: aws s3 sync applications/admin/.next/static s3://$ASSETS_DOMAIN/admin/_next/static --cache-control immutable,max-age=31536000,public --storage-class STANDARD_IA --region us-east-1
      - name: Upload Next.js Fonts to Assets Bucket
        run: aws s3 sync applications/admin/public/fonts s3://$ASSETS_DOMAIN/admin/fonts --cache-control immutable,max-age=31536000,public --storage-class STANDARD_IA --region us-east-1
      - name: Upload Next.js Images to Assets Bucket
        run: aws s3 sync applications/admin/public/images s3://$ASSETS_DOMAIN/admin/images --cache-control immutable,max-age=31536000,public --storage-class STANDARD_IA --region us-east-1
      - name: Deploy Serverless Application to us-east-1
        run: serverless deploy --stage $BRANCH --region us-east-1
        working-directory: applications/admin
      - name: Deploy Serverless Application to eu-west-1
        run: serverless deploy --stage $BRANCH --region eu-west-1
        working-directory: applications/admin
        if: ${{ github.ref == 'refs/heads/production' }}
      - name: Deploy Serverless Application to ap-northeast-1
        run: serverless deploy --stage $BRANCH --region ap-northeast-1
        working-directory: applications/admin
        if: ${{ github.ref == 'refs/heads/production' }}
      - name: Sync .serverless directory
        run: aws s3 sync .serverless s3://greatupsells-infrastructure/serverless/admin/.serverless --region us-east-1
        working-directory: applications/admin
      - name: Uninstall Global Packages
        if: always()
        run: npm uninstall -g yarn serverless
