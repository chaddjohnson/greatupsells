name: greatupsells-admin
on:
  push:
    branches:
      - test
      - master
    paths:
      - .github/workflows/admin.yml
      - applications/admin/**
      - packages/react-components/**
      - packages/react-hooks/**
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Set Environment Variables
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          if [[ "$BRANCH_NAME" == "master" ]]; then
            STAGE="production"
          else
            STAGE="$BRANCH_NAME"
          fi
          echo "BRANCH=$BRANCH_NAME" >> $GITHUB_ENV
          echo "STAGE=$STAGE" >> $GITHUB_ENV
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
      - name: Inject "ASSETS_DOMAIN" SSM Parameter
        uses: 'marvinpinto/action-inject-ssm-secrets@latest'
        with:
          ssm_parameter: '/greatupsells/${{ env.STAGE }}/assets/domain'
          env_variable_name: 'ASSETS_DOMAIN'
      - name: Inject "ASSETS_URL" SSM Parameter
        uses: 'marvinpinto/action-inject-ssm-secrets@latest'
        with:
          ssm_parameter: '/greatupsells/${{ env.STAGE }}/assets/url'
          env_variable_name: 'ASSETS_URL'
      - name: Inject "ADMIN_API_URL" SSM Parameter
        uses: 'marvinpinto/action-inject-ssm-secrets@latest'
        with:
          ssm_parameter: '/greatupsells/${{ env.STAGE }}/admin-api/url'
          env_variable_name: 'ADMIN_API_URL'
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: yarn
      - uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - name: Install Node Modules
        run: yarn install --immutable
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Install Global Packages
        run: npm install -g serverless@3.38.0
      - name: Run Terraform
        run: yarn infrastructure
        working-directory: applications/admin
        env:
          STAGE: ${{ env.STAGE }}
      - name: Build Packages
        run: yarn workspaces focus --all && NODE_ENV=production lerna run build --stream --scope="@greatupsells/*"
      - name: Download .serverless directory
        run: aws s3 sync s3://greatupsells-infrastructure2/serverless/admin . --region us-east-1
        working-directory: applications/admin
      - name: Build Next.js Application
        run: NODE_ENV=production yarn build
        working-directory: applications/admin
      - name: Upload Next.js Static Assets to Assets Bucket
        run: aws s3 sync applications/admin/.next/static s3://$ASSETS_DOMAIN/admin/_next/static --cache-control immutable,max-age=31536000,public --region us-east-1
      - name: Upload Next.js Fonts to Assets Bucket
        run: aws s3 sync applications/admin/public/fonts s3://$ASSETS_DOMAIN/admin/fonts --cache-control immutable,max-age=31536000,public --region us-east-1
      - name: Upload Next.js Images to Assets Bucket
        run: aws s3 sync applications/admin/public/images s3://$ASSETS_DOMAIN/admin/images --cache-control immutable,max-age=31536000,public --region us-east-1
      - name: Deploy Serverless Application to us-east-1
        run: serverless deploy --stage $BRANCH --region us-east-1
        working-directory: applications/admin
      # - name: Deploy Serverless Application to eu-west-1
      #   run: serverless deploy --stage $BRANCH --region eu-west-1
      #   working-directory: applications/admin
      #   if: ${{ github.ref == 'refs/heads/master' }}
      # - name: Deploy Serverless Application to ap-northeast-1
      #   run: serverless deploy --stage $BRANCH --region ap-northeast-1
      #   working-directory: applications/admin
      #   if: ${{ github.ref == 'refs/heads/master' }}
      - name: Sync .serverless directory
        run: aws s3 sync .serverless s3://greatupsells-infrastructure2/serverless/admin/.serverless --region us-east-1
        working-directory: applications/admin
      - name: Uninstall Global Packages
        if: always()
        run: npm uninstall -g serverless
