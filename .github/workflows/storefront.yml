name: greatupsells-storefront
on:
  push:
    branches:
      - test
      - master
    paths:
      - .github/workflows/storefront.yml
      - applications/storefront/**
      - packages/react-components/**
      - packages/react-hooks/**
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Set Environment Variables
        run: |
          BRANCH_NAME="${GITHUB_REF##*/}"
          if [[ "$BRANCH_NAME" == "master" ]]; then
            STAGE="production"
          else
            STAGE="$BRANCH_NAME"
          fi
          echo "BRANCH=$BRANCH_NAME" >> $GITHUB_ENV
          echo "STAGE=$STAGE" >> $GITHUB_ENV
      - name: Inject "STOREFRONT_API_URL" SSM Parameter
        uses: 'marvinpinto/action-inject-ssm-secrets@latest'
        with:
          ssm_parameter: '/greatupsells/${{ env.STAGE }}/storefront-api/url'
          env_variable_name: 'STOREFRONT_API_URL'
      - name: Inject "ASSETS_URL" SSM Parameter
        uses: 'marvinpinto/action-inject-ssm-secrets@latest'
        with:
          ssm_parameter: '/greatupsells/${{ env.STAGE }}/assets/url'
          env_variable_name: 'ASSETS_URL'
      - name: Inject "ASSETS_DOMAIN" SSM Parameter
        uses: 'marvinpinto/action-inject-ssm-secrets@latest'
        with:
          ssm_parameter: '/greatupsells/${{ env.STAGE }}/assets/domain'
          env_variable_name: 'ASSETS_DOMAIN'
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.12.2
          cache: yarn
      - uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - name: Install Node Modules
        run: yarn install --immutable
      - name: Build Packages
        run: yarn workspaces focus --all && NODE_ENV=production lerna run build --stream --scope="@greatupsells/*"
      - name: Build Application
        run: NODE_ENV=production yarn build
        working-directory: applications/storefront
      - name: Upload Application to Assets Bucket
        run: aws s3 sync applications/storefront/dist/ s3://$ASSETS_DOMAIN --cache-control public,must-revalidate,proxy-revalidate,max-age=300,s-maxage=300 --region us-east-1
