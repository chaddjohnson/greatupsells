name: upselling-storefront
on:
  push:
    branches:
      - test
      - production
    paths:
      - .github/workflows/storefront.yml
      - applications/storefront/**
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Set Environment Variables
        run: echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 14.17.0
      - name: Install Global Packages
        run: npm install -g yarn
      - name: Install Node Modules
        run: yarn install
      - name: Build Packages
        run: lerna bootstrap --force-local && NODE_ENV=production lerna run build --stream --scope=@neatowebsolutions/*
      - name: Build Application
        run: NODE_ENV=production yarn build
      - name: Upload Application to Assets Bucket
        run: aws s3 sync applications/storefront/dist/storefront.js s3://assets.greatupsells.com --cache-control public,must-revalidate,proxy-revalidate,max-age=0,s-maxage=0 --storage-class STANDARD_IA
      - name: Uninstall Global Packages
        if: always()
        run: npm uninstall -g yarn serverless
