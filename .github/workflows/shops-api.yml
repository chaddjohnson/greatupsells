name: greatupsells-shops-api
on:
  push:
    branches:
      - test
      - production
    paths:
      - .github/workflows/shops-api.yml
      - services/shops-api/**
      - packages/logger/**
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
    steps:
      - name: Set Environment Variables
        run: echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16.13.0
          cache: yarn
      - uses: actions/cache@v3
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/yarn.lock') }}
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
      - name: Install Global Packages
        run: npm install -g serverless
      - name: Run Terraform
        run: yarn infrastructure
        working-directory: services/shops-api
        env:
          STAGE: ${{ env.BRANCH }}
          MONGODB_APP_PASSWORD: ${{ secrets.MONGODB_APP_PASSWORD }}
      - name: Inject "MONGODB_URL_SHOPS" SSM Parameter
        uses: 'marvinpinto/action-inject-ssm-secrets@latest'
        with:
          ssm_parameter: '/greatupsells/${{ env.BRANCH }}/database/mongodb-shops/url'
          env_variable_name: 'MONGODB_URL_SHOPS'
      - name: Install Node Modules
        run: yarn install --immutable
      - name: Build Packages
        run: lerna bootstrap --force-local && NODE_ENV=production lerna run build --stream --scope=@greatupsells/*
      - name: Run Data Migrations
        run: yarn migrate
        working-directory: services/shops-api
        env:
          MONGODB_URL_SHOPS: ${{ env.MONGODB_URL_SHOPS }}
      - name: Download .serverless directory
        run: aws s3 sync s3://greatupsells-infrastructure/serverless/shops-api . --region us-east-1
        working-directory: services/shops-api
      - name: Deploy Serverless Application to us-east-1
        run: serverless deploy --stage $BRANCH --region us-east-1
      #   working-directory: services/shops-api
      # - name: Deploy Serverless Application to eu-west-1
      #   run: serverless deploy --stage $BRANCH --region eu-west-1
      #   working-directory: services/shops-api
      #   if: ${{ github.ref == 'refs/heads/production' }}
      # - name: Deploy Serverless Application to ap-northeast-1
      #   run: serverless deploy --stage $BRANCH --region ap-northeast-1
      #   working-directory: services/shops-api
      #   if: ${{ github.ref == 'refs/heads/production' }}
      - name: Sync .serverless directory
        run: aws s3 sync .serverless s3://greatupsells-infrastructure/serverless/shops-api/.serverless --region us-east-1
        working-directory: services/shops-api
      - name: Uninstall Global Packages
        if: always()
        run: npm uninstall -g serverless
