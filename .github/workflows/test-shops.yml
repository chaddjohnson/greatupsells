name: upselling-shops-service
on:
  push:
    branches:
      - test
    paths:
      - services/shops/**
      - packages/logger/**
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      PLACEHOLDER: value
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 14.17.0
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v1
      - name: Install Global Packages
        run: npm install -g yarn serverless
      - name: Run Terraform
        run: (cd services/shops && STAGE=test AWS_REGION=us-east-1 ./scripts/infrastructure.sh)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Install Node Modules
        run: yarn install
      - name: Exclude AWS SDK
        run: find node_modules -name aws-sdk -exec rm -rf {} +
      - name: Run Serverless (us-east-1)
        run: AWS_REGION=us-east-1 deploy -s test
        working-directory: services/shops
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Uninstall Global Packages
        if: always()
        run: npm uninstall -g yarn serverless
