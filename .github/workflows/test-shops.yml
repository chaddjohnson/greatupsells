name: upselling-shops-service
on:
  push:
    branches:
      - test
    paths:
      - services/shops/**
      - packages/logger/**
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      PLACEHOLDER: value
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 14.17.0
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v1
      - name: Install Global Packages
        run: npm install -g yarn serverless
      - name: Run Terraform
        run: |
          terraform init services/shops/infrastructure \
          terraform validate services/shops/infrastructure \
          terraform workspace select test services/shops/infrastructure || { terraform workspace new test services/shops/infrastructure && terraform init services/shops/infrastructure; } \
          terraform apply TF_VAR_region="us-east-1" -var-file=services/shops/infrastructure/config/test.tfvars -auto-approve services/shops/infrastructure
      - name: Install Node Modules
        run: yarn install
      - name: Exclude AWS SDK
        run: find node_modules -name aws-sdk -exec rm -rf {} +
      - name: Run Serverless
        run: deploy -s test
        working-directory: services/shops
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Uninstall Global Packages
        if: always()
        run: npm uninstall -g yarn serverless
