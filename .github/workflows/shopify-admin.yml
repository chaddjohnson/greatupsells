name: upselling-shopify-admin
on:
  push:
    branches:
      - test
      - production
    paths:
      - .github/workflows/shopify-admin.yml
      - applications/shopify-admin/**
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Set Environment Variables
        run: echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 14.17.0
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v1
      - name: Install Global Packages
        run: npm install -g yarn serverless
      - name: Run Terraform
        run: (cd ./applications/shopify-admin/infrastructure && STAGE=$BRANCH ./run.sh)
      - name: Install Node Modules
        run: yarn install
      - name: Build Packages
        run: lerna bootstrap --force-local && NODE_ENV=production lerna run build --stream --scope=@neatowebsolutions/*
      - name: Build Next.js Application
        run: NODE_ENV=production yarn build
      - name: Upload Next.js to Assets Bucket
        run: aws s3 sync applications/shopify-admin/.next/static s3://assets.greatupsells.com/shopify-admin/_next/static --delete --cache-control immutable,max-age=31536000,public --storage-class STANDARD_IA
      - name: Deploy Serverless Application to us-east-1
        run: serverless deploy --stage $BRANCH --region us-east-1
        working-directory: applications/shopify-admin
      - name: Deploy Serverless Application to eu-west-1
        run: serverless deploy --stage $BRANCH --region eu-west-1
        working-directory: applications/shopify-admin
        if: ${{ github.ref == 'refs/heads/production' }}
      - name: Deploy Serverless Application to ap-northeast-1
        run: serverless deploy --stage $BRANCH --region ap-northeast-1
        working-directory: applications/shopify-admin
        if: ${{ github.ref == 'refs/heads/production' }}
      - name: Uninstall Global Packages
        if: always()
        run: npm uninstall -g yarn serverless
