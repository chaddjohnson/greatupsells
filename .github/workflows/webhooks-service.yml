name: upselling-webhooks-service
on:
  push:
    branches:
      - test
      - production
    paths:
      - .github/workflows/webhooks-service.yml
      - services/webhooks/**
      - packages/logger/**
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Set Environment Variables
        run: echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: Checkout
        uses: actions/checkout@v2
      - name: Install Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 14.17.0
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v1
      - name: Install Global Packages
        run: npm install -g yarn serverless
      - name: Run Terraform
        run: (cd ./services/webhooks/infrastructure && STAGE=$BRANCH ./run.sh)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Install Node Modules
        run: yarn install
      - name: Build Packages
        run: NODE_ENV=production lerna bootstrap --force-local && lerna run build --stream --scope=@neatowebsolutions/*
      - name: Deploy Serverless (us-east-1)
        run: AWS_REGION=us-east-1 serverless deploy -s $BRANCH
        working-directory: services/webhooks
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - name: Uninstall Global Packages
        if: always()
        run: npm uninstall -g yarn serverless
