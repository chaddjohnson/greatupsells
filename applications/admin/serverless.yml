service: greatupsells-admin
frameworkVersion: '^3.38'
useDotenv: true
configValidationMode: error
provider:
  name: aws
  architecture: arm64
  runtime: nodejs20.x
  memorySize: 2048
  timeout: 10
  endpointType: REGIONAL
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}
  versionFunctions: false
  logRetentionInDays: 14
  httpApi:
    shouldStartNameWithService: true
    cors: true
  environment:
    NODE_ENV: ${env:NODE_ENV, 'production'}
    ADMIN_API_URL: ${env:ADMIN_API_URL, ssm:/greatupsells/${self:provider.stage}/admin-api/url}
    JWT_SECRET: ${env:JWT_SECRET, ssm:/greatupsells/${self:provider.stage}/jwt-secret}
    SHOPS_API_URL: ${env:SHOPS_API_URL, ssm:/greatupsells/${self:provider.stage}/shops-api/url}

custom:
  customDomain:
    domainName: ${ssm:/greatupsells/${self:provider.stage}/admin-app/domain}
    basePath: ''
    certificateName: ${ssm:/greatupsells/${self:provider.stage}/certificate-name, ''}
    createRoute53Record: true
    endpointType: regional
    apiType: http
    route53Params:
      routingPolicy: simple
      setIdentifier: ${self:provider.region}
      healthCheckId: ${ssm:/greatupsells/${self:provider.stage}/admin-app/health-check-id, ''}
    securityPolicy: tls_1_2
    autoDomain: true
  warmup:
    default:
      enabled: true
      concurrency: 1
      prewarm: true
      events:
        - schedule: rate(5 minutes)

functions:
  health:
    handler: src/routes/health.handler
    events:
      - httpApi:
          path: /health
          method: get
  region:
    handler: src/routes/region.handler
    events:
      - httpApi:
          path: /region
          method: get
    warmup:
      default:
        enabled: false
  server:
    role: ${env:SERVICES_CONSUMER_ROLE_ARN, ssm:/greatupsells/${self:provider.stage}/roles/services-consumer-arn}
    handler: src/routes/server.handler
    events:
      - httpApi:
          path: /
          method: ANY
      - httpApi:
          path: /{any+}
          method: ANY

plugins:
  - serverless-plugin-monorepo
  - serverless-domain-manager
  - serverless-plugin-warmup

package:
  patterns:
    - '!infrastructure/**'
    - '!.next/cache/webpack/**'
