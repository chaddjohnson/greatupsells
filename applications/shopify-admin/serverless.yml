service: upselling-shopify-admin

provider:
  name: aws
  runtime: nodejs12.x
  memorySize: 256
  timeout: 10
  endpointType: REGIONAL
  stage: ${env:STAGE, 'dev'}
  region: ${env:AWS_REGION, 'us-east-1'}
  versionFunctions: false
  logRetentionInDays: 14
  apiGateway:
    shouldStartNameWithService: true
  environment:
    JWT_SECRET: ${env:JWT_SECRET, ssm:/upselling/${self:provider.stage}/jwt-secret~true}
    PUBLIC_API_URL: ${env:PUBLIC_API_URL, ssm:/upselling/${self:provider.stage}/public-api/url}
    SHOPIFY_ADMIN_API_KEY: ${env:SHOPIFY_ADMIN_API_KEY, ssm:/upselling/${self:provider.stage}/shopify-admin/api-key}
    SHOPIFY_ADMIN_API_SECRET_KEY: ${env:SHOPIFY_ADMIN_API_SECRET_KEY, ssm:/upselling/${self:provider.stage}/shopify-admin/api-secret-key~true}
    SHOPIFY_ADMIN_URL: ${env:SHOPIFY_ADMIN_URL, ssm:/upselling/${self:provider.stage}/shopify-admin/url}
    SHOPS_API_URL: ${env:SHOPS_API_URL, ssm:/upselling/${self:provider.stage}/shops-api/url}

functions:
  health:
    memorySize: 128
    handler: server/health.handler
    events:
      - http:
          path: /health
          method: get
          cors: true
  region:
    memorySize: 128
    handler: server/region.handler
    events:
      - http:
          path: /region
          method: get
          cors: true
  server:
    role: ${ssm:/upselling/${self:provider.stage}/roles/services-consumer-arn}
    handler: server/index.handler
    events:
      - http:
          path: /
          method: ANY
      - http:
          path: /{any+}
          method: ANY

plugins:
  - serverless-plugin-monorepo
  - serverless-domain-manager

custom:
  customDomain:
    domainName: ${ssm:/upselling/${self:provider.stage}/shopify-admin/endpoint/${self:provider.region}}
    basePath: ''
    certificateName: ${ssm:/upselling/${self:provider.stage}/certificate-name}
    createRoute53Record: true
    endpointType: regional
    securityPolicy: tls_1_2

package:
  exclude:
    - test/**
    - node_modules/aws-sdk
    - node_modules/**/aws-sdk
    - node_modules/**/*.map
