- name: Wait for the server to be reachable
  wait_for_connection:
    timeout: 900

- name: Gather facts for first time
  setup:

- name: Update all packages
  apt:
    upgrade: dist

- name: Prevent unattended upgrades
  apt:
    pkg: unattended-upgrades
    state: absent

- name: Set vm.swappiness
  sysctl:
    name: vm.swappiness
    value: '10'
    state: present

- name: Install packages
  apt:
    name: "{{ packages }}"
    state: latest
    update_cache: yes
    cache_valid_time: 3600
  vars:
    packages:
      - software-properties-common
      - ntp
      - python3
      - python3-pip
      - jq

- name: Install AWS CLI
  raw: pip3 install -q awscli --upgrade

- name: Install Python packages
  raw: pip3 install -q pymongo --upgrade
