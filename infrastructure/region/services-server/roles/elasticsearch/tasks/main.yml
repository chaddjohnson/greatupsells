- name: Determine if Elasticsearch is installed
  stat:
    path: /etc/elasticsearch/elasticsearch.yml
  register: elasticsearch

- name: Add Elasticsearch GPG key
  apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present
  when: not elasticsearch.stat.exists

- name: Add Elasticsearch sources list
  lineinfile:
    line: 'deb https://artifacts.elastic.co/packages/7.x/apt stable main'
    dest: /etc/apt/sources.list.d/elastic-7.x.list
    state: present
    create: yes
  when: not elasticsearch.stat.exists

- name: Update apt cache
  apt:
    update_cache: yes
  when: not elasticsearch.stat.exists

- name: Install Elasticsearch
  apt:
    name: elasticsearch
    state: present
    update_cache: yes
    cache_valid_time: 3600
    allow_unauthenticated: yes
  when: not elasticsearch.stat.exists

- name: Create Elasticsearch config file (test)
  copy:
    src: elasticsearch-test.yml
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: root
    mode: 0644
  when:
    - not elasticsearch.stat.exists
    - stage == "test"

- name: Create Elasticsearch config file (production, us-east-1)
  copy:
    src: elasticsearch-us-east-1.yml
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: root
    mode: 0644
  when:
    - not elasticsearch.stat.exists
    - stage == "production"
    - region == "us-east-1"

- name: Create Elasticsearch config file (production, eu-west-1)
  copy:
    src: elasticsearch-eu-west-1.yml
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: root
    mode: 0644
  when:
    - not elasticsearch.stat.exists
    - stage == "production"
    - region == "eu-west-1"

- name: Create Elasticsearch config file (production, ap-northeast-1)
  copy:
    src: elasticsearch-ap-northeast-1.yml
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: root
    mode: 0644
  when:
    - not elasticsearch.stat.exists
    - stage == "production"
    - region == "ap-northeast-1"

- name: Ensure Elasticsearch is enabled to start automatically on boot
  systemd:
    name: elasticsearch
    enabled: yes
    state: started
  when: not elasticsearch.stat.exists

- name: Retart Elasticsearch
  service:
    name: elasticsearch
    state: restarted
  when: not elasticsearch.stat.exists
