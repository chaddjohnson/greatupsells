# Reference: https://medium.com/@himanshubhimwal94/a-complete-step-by-step-guide-to-setup-a-3-node-elk-cluster-secured-with-lets-encrypt-b1e988988006

- name: Determine if Elasticsearch is installed
  stat:
    path: /etc/elasticsearch/elasticsearch.yml
  register: elasticsearch

- name: Add Elasticsearch GPG key
  apt_key:
    url: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present
  when: not elasticsearch.stat.exists

- name: Add Elasticsearch sources list
  lineinfile:
    line: 'deb https://artifacts.elastic.co/packages/7.x/apt stable main'
    dest: /etc/apt/sources.list.d/elastic-7.x.list
    state: present
    create: yes
  when: not elasticsearch.stat.exists

- name: Update apt cache
  apt:
    update_cache: yes
  when: not elasticsearch.stat.exists

- name: Install Elasticsearch
  apt:
    name: elasticsearch
    state: present
    update_cache: yes
    cache_valid_time: 3600
    allow_unauthenticated: yes
  when: not elasticsearch.stat.exists

- name: Copy certificates for Elasticsearch
  copy:
    src: /etc/letsencrypt/live/{{ domain }}/
    dest: /etc/elasticsearch/certs/
    remote_src: yes
    local_follow: yes
    owner: root
    group: elasticsearch
    mode: 0644

- name: Set Elasticsearch certs directory permissions
  file:
    path: /etc/elasticsearch/certs
    state: directory
    owner: root
    group: elasticsearch
    mode: 0655

- name: Create Elasticsearch config file (test)
  copy:
    src: elasticsearch-test.yml
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: 0644
  when:
    - stage == "test"

- name: Create Elasticsearch config file (production, us-east-1)
  copy:
    src: elasticsearch-us-east-1.yml
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: root
    mode: 0644
  when:
    - stage == "production"
    - region == "us-east-1"

